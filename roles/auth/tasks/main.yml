---
- name: Install authentication packages
  ansible.builtin.yum:
    name: "{{ auth_packages }}"
    state: present

- name: Configure Kerberos (krb5.conf)
  ansible.builtin.template:
    src: krb5.conf.j2
    dest: "{{ auth_krb5_config_path }}"
    owner: root
    group: root
    mode: '0644'

- name: Check if machine is already joined to the domain
  ansible.builtin.command: realm list
  register: realm_list
  changed_when: false
  failed_when: false

- name: Join Active Directory domain
  ansible.builtin.shell: |
    echo "{{ auth_ad_pass }}" | realm join --user={{ auth_ad_user }} {{ auth_domain_name }}
  when: auth_domain_name not in realm_list.stdout
  no_log: true

- name: Configure SSSD (sssd.conf)
  ansible.builtin.template:
    src: sssd.conf.j2
    dest: "{{ auth_sssd_config_path }}"
    owner: root
    group: root
    mode: '0600'
  notify: Restart sssd

- name: Ensure SSSD is enabled and started
  ansible.builtin.systemd:
    name: sssd
    state: started
    enabled: true

- name: Enable automatic home directory creation
  ansible.builtin.command: authselect select sssd with-mkhomedir --force
  changed_when: false

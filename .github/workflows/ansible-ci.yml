name: Ansible CI
on: [push, pull_request]
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ansible
        run: pip install ansible ansible-lint
      - name: Install Ansible collections
        run: ansible-galaxy collection install --pre -r requirements.yml
      - name: Run ansible-lint
        env:
          ANSIBLE_GALAXY_OPTS: "--pre"
        run: ansible-lint
      - name: Syntax check
        run: ansible-playbook playbooks/site.yml --syntax-check
      - name: Validate collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Dry run with check mode
        run: ansible-playbook playbooks/site.yml --check

name: Ansible CI
on: [push, pull_request]
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ansible
        run: pip install ansible ansible-lint
      - name: Lint
        run: ansible-lint
      - name: Syntax check
        run: ansible-playbook playbooks/site.yml --syntax-check